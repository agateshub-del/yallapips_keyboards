name: Build YallaPips Keyboard EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install MetaTrader5 numpy Pillow hid pystray pyinstaller

      - name: Download and fix hidapi DLL
        shell: pwsh
        run: |
          $hidDir = python -c "import os, importlib.util; print(os.path.dirname(importlib.util.find_spec('hid').origin))"
          Write-Host "HID dir: $hidDir"
          Invoke-WebRequest -Uri "https://github.com/libusb/hidapi/releases/download/hidapi-0.14.0/hidapi-win.zip" -OutFile "hidapi-win.zip"
          Expand-Archive -Path "hidapi-win.zip" -DestinationPath "hidapi-win"
          Copy-Item -Force "hidapi-win\x64\hidapi.dll" "$hidDir\"
          Copy-Item -Force "hidapi-win\x64\hidapi.dll" "C:\Windows\System32\"
          Write-Host "DLL installed"
          python -c "
          import os, importlib.util, sys
          hid_dir = os.path.dirname(importlib.util.find_spec('hid').origin)
          os.add_dll_directory(hid_dir)
          import hid
          print('HID OK:', hid.__file__)
          "
      - name: Build EXE
        run: pyinstaller main.spec

      - name: Verify build
        shell: pwsh
        run: |
          if (Test-Path "dist/YallaPips_Keyboard.exe") {
            $size = (Get-Item "dist/YallaPips_Keyboard.exe").Length / 1MB
            Write-Host "EXE built - $([math]::Round($size,1)) MB"
          } else {
            Write-Error "EXE not found"
            exit 1
          }

      - name: Package zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release
          Copy-Item dist\YallaPips_Keyboard.exe release\
          Copy-Item config.json release\
          Copy-Item README.md release\
          Compress-Archive -Path release\* -DestinationPath YallaPips_Keyboard_Windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YallaPips_Keyboard_Windows
          path: YallaPips_Keyboard_Windows.zip
          retention-days: 90
