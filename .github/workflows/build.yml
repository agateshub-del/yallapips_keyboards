name: Build YallaPips Keyboard EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build EXE
      run: |
        pyinstaller main.spec

    - name: Verify build
      run: |
        if (Test-Path "dist/YallaPips_Keyboard.exe") {
          $size = (Get-Item "dist/YallaPips_Keyboard.exe").Length / 1MB
          Write-Host "EXE built — $([math]::Round($size,1)) MB"
        } else {
          Write-Error "EXE not found"
          exit 1
        }
      shell: pwsh

    - name: Package release zip
      run: |
        mkdir release
        copy dist\YallaPips_Keyboard.exe release\
        copy config.json release\
        copy README.md release\
        Compress-Archive -Path release\* -DestinationPath YallaPips_Keyboard_Windows.zip
      shell: pwsh

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: YallaPips_Keyboard_Windows
        path: YallaPips_Keyboard_Windows.zip
        retention-days: 90
