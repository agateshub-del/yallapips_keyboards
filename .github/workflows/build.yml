name: Build YallaPips Keyboard EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install MetaTrader5 numpy Pillow hidapi hid pystray pyinstaller

      - name: Check HID
        run: |
          python -c "import hid; print('HID OK:', hid.__file__)"

      - name: Build EXE
        run: |
          pyinstaller main.spec

      - name: Verify build
        shell: pwsh
        run: |
          if (Test-Path "dist/YallaPips_Keyboard.exe") {
            $size = (Get-Item "dist/YallaPips_Keyboard.exe").Length / 1MB
            Write-Host "EXE built successfully - $([math]::Round($size,1)) MB"
          } else {
            Write-Error "EXE not found"
            exit 1
          }

      - name: Package zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release
          Copy-Item dist\YallaPips_Keyboard.exe release\
          Copy-Item config.json release\
          Copy-Item README.md release\
          Compress-Archive -Path release\* -DestinationPath YallaPips_Keyboard_Windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YallaPips_Keyboard_Windows
          path: YallaPips_Keyboard_Windows.zip
          retention-days: 90
